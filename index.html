<style>

<script>
const N={d01:["01 Intake & coverage",["Patient demographics / coverage summary · Chart ID: DEMO-PSY-0007","Name: Jordan Ellis · DOB: 1993-04-12","Coverage: UnitedHealthcare Community Plan of Arizona (Medicaid)","Member ID: DEMO-NOT-VALID","Request: Initial PA for Vraylar 1.5 mg capsule, oral once daily, 30 capsules per 30 days"]],
d02:["02 Initial evaluation · 2026-05-04",["Initial psychiatric evaluation — 2026-05-04","Assessment: Bipolar I disorder, current episode depressed. Clinical diagnosis documented; symptom rating scales not available.","Medication history: Reports previous trials of lurasidone and quetiapine. Patient also recalls a valproate trial but cannot recall dates."]],
d03:["03 Follow-up · 2026-06-15",["Psychiatry follow-up — 2026-06-15","Medication review: Outside prescribing summary indicates lurasidone 20 mg PO daily started 2026-04-01 and stopped 2026-05-13.","Patient reports taking it consistently and no meaningful improvement in depressive symptoms.","This was a 42-day trial by elapsed calendar days (start inclusive, stop exclusive)."]],
d04:["04 Follow-up · 2026-08-10",["Psychiatry follow-up — 2026-08-10","Historical medication review: Outside note documents quetiapine 50 mg at bedtime, started 2026-01-12, stopped 2026-01-22 after marked daytime sedation and dizziness.","Prescriber recorded medication intolerance/adverse reaction. Do NOT classify this as a 30-day inadequate-response trial."]],
d05:["05 Follow-up · 2026-10-28",["Psychiatry follow-up — 2026-10-28","Patient says &quot;Depakote did not help when I tried it&quot; but neither start/stop dates nor formulation/dose are available in records received.","It is unclear whether the reported trial was valproate monotherapy or adjunctive treatment.","Plan: obtain records clarifying valproate dates, dose, monotherapy status, and response before claiming third qualifying trial."]],
d06:["06 Medication reconciliation · 2026-10-28",["Medication reconciliation / prior treatment history — 2026-10-28","Lurasidone · 2026-04-01 to 2026-05-13 · 20 mg PO daily · Inadequate response after 42 elapsed days","Quetiapine · 2026-01-12 to 2026-01-22 · 50 mg PO at bedtime · Daytime sedation and dizziness; stopped","Valproate / divalproex (patient-reported) · UNKNOWN · Unverified; monotherapy, duration, dose, and outcome need records","No assertion is made about allergy status, pregnancy status, or medication contraindications."]],
d07:["07 Prescription · 2026-10-28",["Prescription order · Order ID: RX-DEMO-007","Drug: Vraylar (cariprazine) 1.5 mg capsule","Sig: Take one capsule by mouth once daily · Quantity: 30 capsules · Days supply: 30 · Refills: 0","Order status: Proposed; pending clinical review and prior authorization workflow"]],
d08:["08 Outside pharmacy records · 2026-10-29",["Outside pharmacy dispensing history — Desert Sun Pharmacy · received 2026-10-29","Patient: Jordan Ellis · DOB 1993-04-12 · Chart DEMO-PSY-0007","Divalproex sodium DR (Depakote) 500 mg PO twice daily · filled 2025-08-04 and 2025-09-03 · 30-day supply each.","Therapy period 2025-08-04 to 2025-10-02 (59 days). No other mood stabilizer or antipsychotic dispensed in this period.","Discontinued 2025-10-02 · prescriber-reported reason: inadequate response, persistent depressive symptoms."]]};
const F={f_dx:{l:"Diagnosis: Bipolar I, current episode depressed",d:"d02",ln:[2],s:"v"},f_lur:{l:"Lurasidone 20 mg, 2026-04-01 to 05-13",d:"d03",ln:[2],s:"v"},f_lo:{l:"Lurasidone outcome: no meaningful improvement",d:"d03",ln:[3],s:"v"},f_q:{l:"Quetiapine: adverse reaction (sedation, dizziness)",d:"d04",ln:[2,3],s:"v"},f_v:{l:"Valproate trial (patient-reported)",d:"d05",ln:[2],s:"u"},f_g:{l:"Valproate monotherapy vs adjunctive: unclear",d:"d05",ln:[3],s:"m"},f_rx:{l:"Rx: Vraylar 1.5 mg daily",d:"d07",ln:[2],s:"v"},
f_v8:{l:"Divalproex 500 mg BID monotherapy, 59 days (2025-08-04 to 10-02)",d:"d08",ln:[3,4],s:"x"},f_vo8:{l:"Valproate outcome: inadequate response",d:"d08",ln:[5],s:"x"}};
const fs=f=>F[f].s==="x"?(S.valVer?"v":"u"):F[f].s;
const C=()=>[["c1","Documented diagnosis of bipolar depression",["f_dx"],"ok"],["c2","Inadequate response to a qualifying therapy (30+ day trial)",["f_lur","f_lo"],"ok"],["c3","Adverse reaction to a second qualifying therapy",["f_q"],"ok"],["c4","Third qualifying therapy: inadequate response or adverse reaction",S.recIn?["f_v8","f_vo8"]:["f_v","f_g"],S.valVer?"ok":S.recIn?"nr":"mi"]];
const L=()=>[["s1","The patient has documented bipolar I disorder, current episode depressed.",["f_dx"]],["s2","Lurasidone was used from April 1 through May 13, 2026, without meaningful improvement.",["f_lur","f_lo"]],["s3","Quetiapine was stopped following documented daytime sedation and dizziness.",["f_q"]],
S.valVer?["s4","Divalproex (Depakote) 500 mg twice daily was used as monotherapy from August 4 through October 2, 2025, and was stopped for inadequate response.",["f_v8","f_vo8"]]:["s4","The patient reports a previous valproate trial, but its details have not been verified.",["f_v","f_g"],1]];
const U={staff_001:["Riley Nguyen","staff","az"],physician_001:["Dr. Morgan Hale","physician","az"],staff_002:["Sam Ortiz","staff","ca"]};
const CS={ok:["✓ Supported","b-ok"],mi:["✕ Missing","b-er"],nr:["! Needs review","b-wn"]},FS={v:["✓ Simulated review","b-ok"],u:["! Unverified","b-wn"],m:["✕ Missing","b-er"]};
const bd=(m,k)=>`<span class="badge ${m[k][1]}">${m[k][0]}</span>`,ct=f=>`N${F[f].d.slice(1)}·L${F[f].ln.join("–")}`;
const AUTH="PA-DEMO-0007-01",PAYER="UnitedHealthcare Community Plan of Arizona",DENY=["Step therapy not met","Plan requires a documented trial of quetiapine for at least 30 days.","ST-30"];
const S0=()=>({user:"staff_001",audit:[],p:{},created:false,ehrSigned:false,recIn:false,valVer:false,signed:false,verRes:null,approved:false,submitted:false,pstep:0,subAt:null});
let S=Object.assign(S0(),JSON.parse(localStorage.eureka||"null")||{});
const V0=()=>({page:S.created?"case":"ehr",ehrTab:"patient",tab:"evidence",fact:null,sent:null,crit:null,doc:"d02",loading:true,collapse:false,run:null,denied:false,busy:null,toastOff:false});
let V=V0();
const save=()=>localStorage.eureka=JSON.stringify(S),say=t=>document.getElementById("live").textContent=t,me=()=>U[S.user],az=()=>me()[2]==="az",wait=ms=>new Promise(r=>setTimeout(r,ms));
async function api(a,c,extra,asUser){const r=await fetch("/api/authz",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({user:asUser||S.user,action:a,caseId:c,proofs:S.p},extra||{}))});const j=await r.json();(j.events||[j.event]).forEach(e=>S.audit.unshift(e));if(j.proof)Object.assign(S.p,j.proof);save();return j}
function reset(){localStorage.removeItem("eureka");S=S0();V=V0();V.page="ehr";closeDlg();document.getElementById("who").value="staff_001";boot()}
function login(u){S.user=u;save();V.denied=false;if(!["ehr","payer","queue","audit"].includes(V.page))V.page="case";boot()}
async function boot(){if(!S.created||V.page==="ehr"||V.page==="payer"){V.loading=false;draw();return}V.loading=true;draw();await api("view_case",az()?"DEMO-PSY-0007":"DEMO-PSY-0012");await wait(450);V.loading=false;draw();say("Case loaded")}
function go(p){V.page=p;V.denied=false;if(p==="case"&&V.loading)return boot();draw()}
function openCase(t){V.page="case";V.tab=t||"evidence";V.denied=false;boot()}
// EHR: its own prescriber session. Eureka never writes to the EHR.
async function ehrSign(){V.busy="sign_order";draw();const j=await api("sign_order","DEMO-PSY-0007",null,"physician_001");if(j.http===200){S.ehrSigned=true;S.created=true}V.busy=null;save();draw();say("Order signed. Prior authorization required")}
async function foreign(){const id=(document.getElementById("cid")||{}).value||"DEMO-PSY-0007";const j=await api("view_case",id.trim());V.denied=j.http!==200;V.page="case";if(!V.denied)return openCase();draw();say(j.http+" "+j.event.action)}
async function reqRecords(e){e&&e.stopPropagation();V.busy="records";draw();await api("request_records","DEMO-PSY-0007");await wait(900);S.recIn=true;V.busy=null;save();V.crit="c4";V.fact="f_v8";V.sent=null;V.doc="d08";V.collapse=false;draw();say("08 Outside pharmacy records received")}
async function verifyFact(e){e&&e.stopPropagation();const j=await api("verify_fact","DEMO-PSY-0007");if(j.http===200){S.valVer=true;S.verRes=null;delete S.p.ver;delete S.p.appr;S.approved=false;save()}draw();say("Criterion 4 supported")}
async function act(a){const j=await api(a,"DEMO-PSY-0007");if(a==="sign_packet"&&j.http===200){S.signed=true;S.verRes=null;delete S.p.ver;save()}
if(a==="approve_packet"&&j.http===200){S.approved=true;save()}
if(a==="submit_packet"){if(j.http===200){S.submitted=true;S.subAt=j.event.at;S.pstep=0;save();dlg("Submitted to payer",`${AUTH} · ${PAYER}`,"Open payer portal","go('payer')")}else{const pr=j.problems||[];const m=pr.includes("third qualifying therapy not verified")?["Go to criterion 4","V.page='case';V.tab='evidence';pickC('c4')"]:pr.includes("physician signature")||pr.includes("independent verification not passed")?["Open verification","V.page='case';V.tab='verify';draw()"]:["Open review queue","go('queue')"];dlg("Submission blocked","Missing: "+pr.join(", ")+".",m[0],m[1])}}
draw();say(j.event.action)}
async function payerAdvance(){if(S.pstep>=3)return;V.busy="payer";draw();await wait(500);const j=await api("payer_update","DEMO-PSY-0007",{step:S.pstep+1});if(j.http===200)S.pstep=j.step;V.busy=null;save();draw();say(j.event.action)}
function pickF(f,e){e&&e.stopPropagation();V.fact=f;V.sent=null;V.doc=F[f].d;V.collapse=false;draw()}
function pickS(i){V.sent=i;V.fact=null;V.doc=F[L().find(s=>s[0]===i)[2][0]].d;draw()}
function pickC(i){V.crit=i;const c=C().find(x=>x[0]===i);pickF(c[2][0])}
const act_f=()=>V.sent?L().find(s=>s[0]===V.sent)[2]:V.fact?[V.fact]:[];
function closeDlg(){document.getElementById("modal").innerHTML=""}
function dlg(t,line,btn,fn){document.getElementById("modal").innerHTML=`<div class="ov" role="dialog" aria-modal="true" aria-label="${t}" onclick="if(event.target===this)closeDlg()"><div class="dlg"><div class="hdr"><h2>${t}</h2><button class="lnk" aria-label="Close" onclick="closeDlg()" style="color:var(--text-muted);font-size:18px;line-height:1">×</button></div><p style="margin:0">${line}</p><div style="text-align:right;margin-top:16px"><button class="btn pri" onclick="closeDlg();${fn}">${btn}</button></div></div></div>`}
async function runVer(){V.run=0;V.tab="verify";draw();const j=await api("run_verifier","DEMO-PSY-0007");for(let i=1;i<=3;i++){await wait(550);V.run=i;S.verRes=Object.assign({},j,{partial:i});draw()}S.verRes=j;if(!j.pass)delete S.p.ver;save();V.run=null;draw();say(j.pass?"Verification passed: 4 of 4 criteria supported":"Verification blocked: 3 of 4 criteria supported")}
const verPass=()=>!!(S.verRes&&S.verRes.pass&&S.p.ver);
// One status model drives the header, queue, packet and portal.
function stat(){const ev=()=>{V.tab="evidence";pickC("c4")};
if(S.pstep>=3)return{b:["✕ Denied","b-er"],stage:"Payer decision",blk:DENY[0],nx:["Open payer portal","go('payer')"],step:6};
if(S.submitted)return{b:[S.pstep>=2?"In clinical review":S.pstep>=1?"Received by payer":"Submitted","b-bl"],stage:"Payer review",blk:"—",nx:["Open payer portal","go('payer')"],step:6};
if(S.approved)return{b:["✓ Approved","b-ok"],stage:"Submission",blk:"—",nx:["Submit to payer","V.tab='packet';draw()"],step:5};
if(verPass())return{b:["Ready for review","b-bl"],stage:"Approval",blk:"Staff approval",nx:["Open review queue","go('queue')"],step:4};
if(S.valVer&&S.signed)return{b:["Ready for verification","b-bl"],stage:"Independent verification",blk:"—",nx:["Run verification","V.tab='verify';draw()"],step:3};
if(S.valVer)return{b:["! Signature pending","b-wn"],stage:"Packet drafted",blk:"Physician signature",nx:["Open packet","V.tab='packet';draw()"],step:2};
return{b:["✕ Blocked","b-er"],stage:"Evidence matched",blk:"Criterion 4: third qualifying therapy",nx:[S.recIn?"Verify valproate record":"Request records","V.tab='evidence';pickC('c4')"],step:1,err:1}}
function nav(){document.getElementById("nav").innerHTML=[["case","Cases"],["queue","Review Queue"],["audit","Audit Log"],["ehr","EHR ↗"],["payer","Payer portal ↗"]].map(([k,t])=>`<button class="nv ${V.page===k?"on":""}" onclick="go('${k}')" ${V.page===k?'aria-current="page"':""}>${t}</button>`).join("");document.getElementById("crumb").textContent=({case:"Cases",queue:"Review Queue",audit:"Audit Log",ehr:"EHR",payer:"Payer portal"})[V.page]+(V.page==="case"&&az()&&S.created?" / DEMO-PSY-0007":"")}
function header(){const st=["Records collected","Evidence matched","Packet drafted","Independent verification","Approval","Submission"],x=stat();
return `<div class="card"><div class="hdr"><div><h1>Jordan Ellis · Vraylar 1.5 mg</h1><div class="meta">Case DEMO-PSY-0007 · Bipolar I, current episode depressed · UnitedHealthcare Community Plan of AZ (Optum Rx) · Order <button class="lnk" onclick="go('ehr')">RX-DEMO-007</button></div></div><span class="badge ${x.b[1]}">${x.b[0]}</span></div>
<div class="glance"><div><b>Stage</b>${x.stage}</div><div><b>Blocker</b>${x.blk}</div><div><b>Next action</b><button class="lnk" onclick="${x.nx[1]}">${x.nx[0]} →</button></div></div>
<div class="stp" aria-label="Workflow">${st.map((s,i)=>{const c=x.err===i?"c":i<x.step?"d":i===x.step?"a":"";return`<div class="${c}">${c==="d"?"✓ ":c==="c"?"✕ ":""}${s}</div>`}).join("")}</div></div>`+(S.pstep>=3?`<div class="alert" style="background:var(--error-bg);color:var(--error);display:flex;align-items:center;gap:12px;margin:0 0 16px"><div style="flex:1"><b>Denial received · ${DENY[0]}</b> · ${DENY[1]}</div><button class="btn" onclick="go('payer')">View in portal</button></div>`:"")}
function viewer(){const [t,ls]=N[V.doc],hl=new Set();act_f().forEach(f=>{if(F[f].d===V.doc)F[f].ln.forEach(n=>hl.add(n))});
return `<div class="card"><div class="hdr"><h2>Source note</h2><button class="lnk" onclick="V.collapse=true;draw()">Collapse</button></div><div class="chips">${Object.keys(N).filter(k=>k!=="d08"||S.recIn).map(k=>`<button class="${k===V.doc?"on":""}" onclick="V.doc='${k}';draw()">N${k.slice(1)}</button>`).join("")}</div>
<div class="note"><div class="t">${t}</div>${ls.map((x,i)=>`<div class="ln ${hl.has(i+1)?"hl":""}"><span>L${i+1}</span><span>${x}</span></div>`).join("")}</div>${prov()}</div>`}
function prov(){const a=act_f();if(!a.length)return"";
return `<h3>Provenance</h3>`+a.map(f=>{const x=F[f],s=fs(f),v=s==="v";return`<div class="k" style="margin-bottom:10px"><span>Fact</span><span>${x.l}</span><span>Source</span><span>${N[x.d][0]}, page 1, ${ct(f).split("·")[1]}</span><span>Extracted by</span><span>cached_demo_extractor_v1</span><span>Verified by</span><span>${v?(x.d==="d08"?"Riley Nguyen":"demo_reviewer_001"):"Not verified"}</span><span>Usable in PA</span><span>${v?"Yes":"No"}</span><span>Status</span><span>${bd(FS,s)}</span></div>`}).join("")}
function c4act(){if(!az())return"";if(!S.recIn)return`<div style="margin-top:8px"><button class="btn" onclick="reqRecords(event)" ${V.busy==="records"?"disabled":""}>${V.busy==="records"?"Requesting…":"Request records"}</button></div>`;
if(!S.valVer)return`<div style="margin-top:8px"><button class="btn pri" onclick="verifyFact(event)">Verify</button> <span class="meta">New evidence in N08</span></div>`;return""}
function evidence(){const c=C(),n=c.filter(x=>x[3]==="ok").length;return `<div class="split ${V.collapse?"col":""}"><div class="card"><h2>Payer criteria</h2><div class="meta" style="margin-bottom:8px">${n} of 4 supported${n<4?" · 1 needs review":""}</div>${c.map((x,i)=>`<div class="cr ${V.crit===x[0]?"on":""}" onclick="pickC('${x[0]}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')pickC('${x[0]}')"><div class="num">${i+1}</div><div><b>${x[1]}</b> ${bd(CS,x[3])}<div class="ev">${x[2].map(f=>`<div><button class="cite ${V.fact===f?"on":""}" onclick="pickF('${f}',event)" aria-label="Open source ${ct(f)}">${ct(f)}</button>${F[f].l} ${bd(FS,fs(f))}</div>`).join("")}</div>${x[0]==="c4"?c4act():""}</div></div>`).join("")}</div>${V.collapse?`<button class="btn" onclick="V.collapse=false;draw()">Show source note</button>`:viewer()}</div>`}
function packet(){const ph=me()[1]==="physician";return `<div class="split"><div><div class="page"><h3>Prior authorization request</h3><div class="k"><span>Patient</span><span>Jordan Ellis · DOB 1993-04-12</span><span>Medication</span><span>Vraylar (cariprazine) 1.5 mg, 1 PO daily, 30 caps, 0 refills</span><span>Diagnosis</span><span>Bipolar I disorder, current episode depressed</span><span>Prescriber</span><span>Morgan Hale, MD</span><span>Payer</span><span>UnitedHealthcare Community Plan of AZ / Optum Rx</span><span>Member ID</span><span>DEMO-NOT-VALID</span><span>Policy</span><span>GL-519189</span></div></div>
<div class="page"><h3>Letter of medical necessity · draft</h3>${L().map(s=>`<div class="snt ${V.sent===s[0]?"on":""} ${s[3]?"ex":""}" onclick="pickS('${s[0]}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')pickS('${s[0]}')">${s[1]} ${s[2].map(f=>`<span class="cite">${ct(f)}</span>`).join("")}${s[3]?`<div class="meta" style="color:var(--error)">✕ Excluded · unverified source</div>`:""}</div>`).join("")}<div class="sig">${S.signed?"✓ Signed · Morgan Hale, MD":"Signature pending"}</div></div>
<div class="page"><h3>Attachments</h3>${["d02","d03","d04","d05","d07"].concat(S.recIn?["d08"]:[]).map(d=>`<div>📄 ${N[d][0]}</div>`).join("")}</div>
<div class="card"><button class="btn" onclick="act('sign_packet')" ${ph&&!S.signed?"":"disabled"}>${S.signed?"✓ Signed":"Sign packet"}</button> ${S.submitted?`<button class="btn pri" disabled>✓ Submitted</button> <button class="lnk" onclick="go('payer')">View in payer portal →</button>`:`<button class="btn pri" onclick="act('submit_packet')">Submit to payer</button>`}${!ph&&!S.signed?`<div class="help">Physician signature required</div>`:""}</div></div>${V.collapse?`<button class="btn" onclick="V.collapse=false;draw()">Show source note</button>`:viewer()}</div>`}
function verify(){const r=V.run,R=S.verRes,d=R&&r===null,sh=d?3:R?R.partial||0:0,n=d?R.supported:null;
return `<div class="ver"><div class="meta" style="color:#A9ADB8">INDEPENDENT VERIFICATION</div><div style="margin-top:10px"><span class="big">${d?n:"–"}</span><span style="font-size:20px"> / 4 criteria supported</span></div>
<div class="seg" aria-hidden="true">${[0,1,2,3].map(i=>`<i class="${d?(i<n?"p":"f"):""}"></i>`).join("")}</div>
${(R?R.checks:[["Every letter claim has a verified source"],["Criteria supported by evidence"],["Physician signature"]]).map((c,i)=>`<div class="fnd"><div>${c[0]}<small>${i<sh?c[1]:"Not run"}</small></div><div>${i<sh?(c[2]?"✓ Pass":"✕ Fail"):"…"}</div></div>`).join("")}
<div style="margin-top:14px"><button class="btn pri" onclick="runVer()" ${r!==null?"disabled":""}>${r!==null?`Running check ${r+1} of 3…`:d?"Re-run verification":"Run verification"}</button> ${d?(R.pass?'<span class="badge b-ok" style="margin-left:8px">✓ Passed · ready for review</span>':'<span class="badge b-er" style="margin-left:8px">✕ Blocked</span>'):""}</div></div>`}
function caseView(){if(V.loading)return`<div class="card"><div class="sk" style="width:50%;height:24px"></div><div class="sk"></div><div class="sk" style="width:80%"></div></div>`;
if(az()&&!S.created)return`<div class="card"><h1>No cases yet</h1><div style="margin-top:10px"><span class="badge b-mu">Waiting for EHR</span></div><div style="margin-top:14px"><button class="btn pri" onclick="go('ehr')">Open EHR</button></div></div>`;
if(!az())return`<div class="card"><h1>No cases yet</h1><p class="muted" style="margin-bottom:0">Coastal Behavioral Health</p></div>`;
return header()+`<div class="tabs" role="tablist">${[["evidence","Evidence"],["packet","Packet"],["verify","Verification"]].map(([k,t])=>`<button role="tab" aria-selected="${V.tab===k}" class="${V.tab===k?"on":""}" onclick="V.tab='${k}';draw()">${t}</button>`).join("")}</div>`+(V.tab==="evidence"?evidence():V.tab==="packet"?packet():verify())}
const EN=["Psychiatry follow-up — 2026-10-28 · Author: Morgan Hale, MD","Chief concern: Persistent bipolar depressive symptoms affecting work and daily functioning.","Interval: No current symptoms suggesting mania reported. Previous lurasidone inadequate response and quetiapine intolerance reviewed.","Patient says &quot;Depakote did not help when I tried it&quot; but neither start/stop dates nor formulation/dose are available in records received.","It is unclear whether the reported trial was valproate monotherapy or adjunctive treatment.","Assessment: Bipolar I disorder, current episode depressed.","Plan: Consider cariprazine (Vraylar) 1.5 mg PO daily for bipolar depression. Initiate PA evidence review; obtain records clarifying valproate dates, dose, monotherapy status, and response.","Order RX-DEMO-007 · Order date: 2026-10-28 · Drug: Vraylar (cariprazine) 1.5 mg capsule","Sig: Take one capsule by mouth once daily · Quantity: 30 capsules · Days supply: 30 · Refills: 0","Order status: Proposed; pending clinical review and prior authorization workflow"];
const PAL=10;
function ehr(){const sg=S.ehrSigned,t=V.ehrTab;
const toast=sg&&!V.toastOff?`<div class="ntf" role="status"><div style="flex:1"><b>Prior authorization required</b><div class="meta">Jordan Ellis · Vraylar 1.5 mg</div></div><button class="btn pri" onclick="openCase()">Open case</button><button class="lnk" aria-label="Dismiss" onclick="V.toastOff=true;draw()" style="color:var(--text-muted);font-size:18px;line-height:1">×</button></div>`:"";
const tabs=[["schedule","Schedule",0],["inbasket","In Basket"+(sg?" (1)":""),1],["referrals","Referrals",0],["patient","Patient",1]].map(([k,l,en])=>`<button class="${t===k?"on":""}" ${en?`onclick="V.ehrTab='${k}';draw()"`:"disabled"}>${l}</button>`).join("");
const side=`<div class="meta" style="text-transform:uppercase;letter-spacing:.4px">Patient</div><div style="font-weight:600;font-size:15px;margin:2px 0 10px">Jordan Ellis</div><div class="k" style="grid-template-columns:78px 1fr"><span>Chart</span><span>DEMO-PSY-0007</span><span>DOB</span><span>1993-04-12 (33)</span><span>Coverage</span><span>UnitedHealthcare Community Plan of AZ (Optum Rx)</span><span>Member ID</span><span>DEMO-NOT-VALID</span><span>Prescriber</span><span>Morgan Hale, MD</span></div>`;
const note=`<div class="hdr"><h2 style="margin:0">Visit note &amp; order · 2026-10-28</h2>${sg?'<span class="badge b-ok">✓ Signed – Morgan Hale, MD</span>':'<span class="badge b-mu">Unsigned</span>'}</div>
<div class="note" style="margin-top:12px"><div class="t">Psychiatry follow-up · Prescription RX-DEMO-007</div>${EN.map((x,i)=>`<div class="ln ${sg&&i+1===PAL?"hl":""}"><span>L${i+1}</span><span>${x}${i+1===PAL&&sg?' <span class="badge b-wn">! Prior authorization required</span>':""}</span></div>`).join("")}</div>
<div style="margin-top:14px"><button class="btn ehrp" onclick="ehrSign()" ${sg||V.busy==="sign_order"?"disabled":""}>${V.busy==="sign_order"?"Signing…":sg?"✓ Signed":"Sign order"}</button></div>`;
const inbox=sg?`<h2>In Basket</h2><table><tr><th>Type</th><th>Patient</th><th>Message</th><th>Action</th></tr><tr><td><span class="badge b-wn">PA required</span></td><td>Jordan Ellis</td><td>Vraylar 1.5 mg · RX-DEMO-007 · L${PAL}</td><td><button class="btn" onclick="openCase()">Open case</button></td></tr></table>`:`<h2>In Basket</h2><p class="muted">No messages</p>`;
return `<div class="ehr"><div class="ehr-top"><b>Sonoran Psychiatry</b><span class="tag">SIMULATED</span><div class="sp"></div><span>Morgan Hale, MD · Prescriber</span></div><div class="ehr-tabs" role="tablist">${tabs}</div>
<div class="ehr-body"><div class="ehr-side">${side}</div><div class="ehr-main">${t==="inbasket"?inbox:note}</div></div></div>${toast}`}
function payer(){const st=["Submitted","Received","Clinical review","Decision"],k=S.pstep,den=k>=3,sub=S.submitted;
const body=!sub?`<h2>Prior authorizations</h2><p class="muted">No requests</p>`:`<div class="hdr"><div><h2 style="margin-bottom:4px">Prior authorization ${AUTH}</h2><div class="meta">Submitted ${new Date(S.subAt).toLocaleString()}</div></div>${den?'<span class="badge b-er">✕ Denied</span>':`<span class="badge b-bl">${st[k]}</span>`}</div>
<div class="stp" aria-label="Authorization status">${st.map((s,i)=>{const c=den&&i===3?"c":i<=k?"d":"";return`<div class="${c}">${c==="d"?"✓ ":c==="c"?"✕ ":""}${i===3&&den?"Denied":s}</div>`}).join("")}</div>
<div class="k" style="margin-top:16px"><span>Member</span><span>Jordan Ellis · DEMO-NOT-VALID</span><span>Drug</span><span>Vraylar (cariprazine) 1.5 mg · 30 capsules / 30 days</span><span>Diagnosis</span><span>Bipolar I disorder, current episode depressed</span><span>Prescriber</span><span>Morgan Hale, MD · Sonoran Psychiatry</span><span>Policy</span><span>GL-519189</span></div>
${den?`<div class="alert" style="background:var(--error-bg);color:var(--error);margin-top:16px"><b>Denied · ${DENY[0]}</b><div>${DENY[1]}</div><div class="meta" style="color:var(--error)">Denial code ${DENY[2]}</div></div>`:`<div style="margin-top:16px"><button class="btn payp" onclick="payerAdvance()" ${V.busy==="payer"?"disabled":""}>${V.busy==="payer"?"Updating…":"Advance status"}</button></div>`}`;
return `<div class="pay"><div class="pay-chrome"><i></i><i></i><i></i><div class="url">https://provider-portal.uhc-optumrx.example/prior-auth${sub?"/"+AUTH:""}</div></div>
<div class="pay-top"><b>${PAYER}</b><span>Optum Rx · Provider portal</span><span class="tag">SIMULATED</span><div class="sp"></div><span>Sonoran Psychiatry</span></div>
<div class="pay-body"><div class="pay-nav"><button class="on">Authorizations</button><button disabled>Eligibility</button><button disabled>Claims</button><button disabled>Medical policies</button></div><div class="pay-main">${body}</div></div></div>`}
function queue(){const x=stat(),st=me()[1]==="staff";return `<h1 style="margin-bottom:16px">Review queue · ${az()?"Sonoran Psychiatry":"Coastal Behavioral Health"}</h1><div class="card" style="padding:0"><table><tr><th>Case</th><th>Patient</th><th>Payer</th><th>Status</th><th>Letter</th><th>Action</th></tr>${az()&&!S.created?`<tr><td colspan="6" class="muted" style="padding:16px">No cases yet</td></tr>`:az()?`<tr><td><b>DEMO-PSY-0007</b></td><td>Jordan Ellis</td><td>UHC Community Plan AZ</td><td><span class="badge ${x.b[1]}">${x.b[0]}</span></td><td><span class="badge ${S.valVer?"b-ok":"b-wn"}">${S.valVer?"✓ 4 of 4 sourced":"3 of 4 sourced"}</span></td><td>${verPass()&&!S.approved?`<button class="btn pri" onclick="act('approve_packet')" ${st?"":"disabled"}>Approve</button> `:""}<button class="btn" onclick="openCase(S.approved&&!S.submitted?'packet':'evidence')">Open case</button>${verPass()&&!S.approved&&!st?`<div class="help" style="margin:0 0 6px">Staff approval required</div>`:""}</td></tr>`:`<tr><td colspan="6" class="muted" style="padding:16px">No cases yet</td></tr>`}</table></div>
<div class="card"><h2>Open case by ID</h2><div style="display:flex;gap:8px"><input id="cid" class="who" value="DEMO-PSY-0007" aria-label="Case ID" style="width:220px"><button class="btn pri" onclick="foreign()">Open</button></div></div>`}
function draw(){nav();let h="";
if(V.denied)h=`<div class="card"><h1>403 · Not in your clinic</h1><div class="alert" style="background:var(--error-bg);color:var(--error)">Access denied. This attempt was logged.</div><button class="btn pri" onclick="go('audit')">View audit log</button> <button class="btn" onclick="go('queue')">Back</button></div>`;
else if(V.page==="audit")h=`<h1 style="margin-bottom:16px">Audit log</h1><div class="card" style="padding:0;overflow:auto"><table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Case</th><th>Result</th><th>Reason</th></tr>${S.audit.map(e=>`<tr><td>${new Date(e.at).toLocaleTimeString()}</td><td>${e.actor}</td><td>${e.action}</td><td>${e.resource}</td><td><span class="badge ${e.result==="allowed"?"b-ok":e.result==="blocked"?"b-wn":"b-er"}">${e.result} · ${e.http}</span></td><td>${e.reason||""}</td></tr>`).join("")||`<tr><td colspan="6" class="muted" style="padding:16px">No events yet</td></tr>`}</table></div>`;
else if(V.page==="queue")h=queue();
else if(V.page==="ehr")h=ehr();
else if(V.page==="payer")h=payer();
else h=caseView();
document.getElementById("app").innerHTML=h}
document.getElementById("who").value=S.user;boot();
</script></body></html>
